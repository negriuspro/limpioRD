{% extends 'base.html' %}
{% block title %}Mapa de Reportes — LimpioRD{% endblock %}

{% block content %}
<style>
    #map { height: 560px; border-radius: 1.25rem; border: 1px solid #e2e8f0; display: block; width: 100%; }
    @media (min-height: 700px) { #map { height: calc(100vh - 280px); min-height: 480px; } }
    .leaflet-popup-content-wrapper { border-radius: 16px !important; box-shadow: 0 20px 60px rgba(0,0,0,0.18) !important; border: none !important; padding: 0 !important; }
    .leaflet-popup-content { margin: 0 !important; padding: 0 !important; min-width: 220px; }
    .leaflet-popup-tip-container { display: none; }
    .filter-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s; border: 2px solid transparent; user-select: none; }
    .filter-pill.active { color: white; border-color: transparent; }
    .filter-pill:not(.active) { background: white; border-color: #e2e8f0; color: #64748b; }
    .filter-pill:not(.active):hover { border-color: #94a3b8; }
</style>
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-5">
        <div>
            <h1 class="text-2xl font-black text-gray-900">Mapa de Reportes</h1>
            <p class="text-sm text-gray-500 mt-1">
                <span class="font-bold text-primary-600">{{ total_activos }}</span>
                reporte{{ total_activos|pluralize:"s" }} activo{{ total_activos|pluralize:"s" }} en el mapa
            </p>
        </div>
        <div class="flex items-center gap-3">
            <span class="inline-flex items-center gap-1.5 text-xs font-bold text-green-600 bg-green-50 px-2.5 py-1 rounded-full border border-green-200">
                <span id="live-pulse" style="transition:opacity 0.4s;"
                      class="w-2 h-2 rounded-full bg-green-500 inline-block animate-pulse"></span>
                LIVE · 30s
            </span>
            <a href="/panel/dashboard/"
               class="hidden sm:inline-flex items-center gap-2 text-sm text-gray-500 hover:text-primary-600 font-semibold transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                Dashboard
            </a>
        </div>
    </div>

    <!-- Filters bar -->
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-3 mb-5 flex flex-wrap gap-2 items-center">
        <span class="text-xs text-gray-400 font-bold uppercase tracking-widest mr-2 ml-1">Filtrar por urgencia:</span>
        <button class="filter-pill active" style="background:#ef4444" data-urgencia="4" onclick="filterByUrgencia(4, this)">
            <span class="w-2 h-2 rounded-full bg-white opacity-80 inline-block"></span> Crítica
        </button>
        <button class="filter-pill active" style="background:#f97316" data-urgencia="3" onclick="filterByUrgencia(3, this)">
            <span class="w-2 h-2 rounded-full bg-white opacity-80 inline-block"></span> Alta
        </button>
        <button class="filter-pill active" style="background:#eab308" data-urgencia="2" onclick="filterByUrgencia(2, this)">
            <span class="w-2 h-2 rounded-full bg-white opacity-80 inline-block"></span> Media
        </button>
        <button class="filter-pill active" style="background:#60a5fa" data-urgencia="1" onclick="filterByUrgencia(1, this)">
            <span class="w-2 h-2 rounded-full bg-white opacity-80 inline-block"></span> Baja
        </button>
        <div class="ml-auto flex items-center gap-2">
            <button onclick="resetView()" class="text-xs text-gray-400 hover:text-primary-600 font-semibold transition-colors">
                Centrar mapa
            </button>
        </div>
    </div>

    <!-- Map -->
    <div id="map" class="w-full shadow-lg"></div>

    <!-- Counter badge -->
    <div class="mt-3 text-right">
        <span id="visible-count" class="text-xs text-gray-400 font-semibold"></span>
    </div>
</div>

<script>
var puntosData = {{ puntos_json|safe }};

// ── Mapa base ────────────────────────────────────────────────────────────
var map = L.map('map', { zoomControl: false }).setView([18.4861, -69.9312], 13);

L.control.zoom({ position: 'bottomright' }).addTo(map);

L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CartoDB',
    maxZoom: 19,
}).addTo(map);

// Forzar render correcto después de que el layout termine
setTimeout(function() { map.invalidateSize(); }, 100);
setTimeout(function() { map.invalidateSize(); }, 500);

// ── Urgencia config ──────────────────────────────────────────────────────
var urgencyConfig = {
    4: { color: '#ef4444', label: 'Crítica',  emoji: '🔴' },
    3: { color: '#f97316', label: 'Alta',     emoji: '🟠' },
    2: { color: '#eab308', label: 'Media',    emoji: '🟡' },
    1: { color: '#60a5fa', label: 'Baja',     emoji: '🔵' },
};

// ── Emojis por categoría ─────────────────────────────────────────────────
function getCatEmoji(nombre) {
    if (!nombre) return '🗑️';
    var n = nombre.toLowerCase();
    if (n.includes('pl') && (n.includes('stic') || n.includes('tico'))) return '♻️';
    if (n.includes('org'))                                               return '🌿';
    if (n.includes('escombro'))                                          return '🧱';
    if (n.includes('electr'))                                            return '💻';
    if (n.includes('vidrio'))                                            return '🍶';
    if (n.includes('papel') || n.includes('cart'))                       return '📦';
    if (n.includes('peligro') || n.includes('hazard'))                   return '⚠️';
    return '🗑️';
}

// ── Crear icono por categoría + urgencia ─────────────────────────────────
function createIcon(punto) {
    var urg      = urgencyConfig[punto.urgencia] || urgencyConfig[2];
    var catColor = punto.color || urg.color;
    var emoji    = getCatEmoji(punto.categoria);

    // CSS map-pin: rotated square with counter-rotated emoji inside + urgency dot
    var html =
        '<div style="position:relative;width:44px;height:44px;">' +
            '<div style="' +
                'width:36px;height:36px;' +
                'background:' + catColor + ';' +
                'border-radius:50% 50% 50% 0;' +
                'transform:rotate(-45deg);' +
                'border:3px solid white;' +
                'box-shadow:0 3px 10px rgba(0,0,0,0.35);' +
                'display:flex;align-items:center;justify-content:center;' +
            '">' +
                '<span style="transform:rotate(45deg);font-size:16px;line-height:1;display:block;">' +
                    emoji +
                '</span>' +
            '</div>' +
            '<div style="' +
                'position:absolute;top:0;right:0;' +
                'width:13px;height:13px;' +
                'background:' + urg.color + ';' +
                'border:2.5px solid white;' +
                'border-radius:50%;' +
            '"></div>' +
        '</div>';

    return L.divIcon({
        className: '',
        html: html,
        iconSize:    [44, 44],
        iconAnchor:  [18, 44],
        popupAnchor: [0, -46],
    });
}

// ── CSRF token para peticiones POST ─────────────────────────────────────
var CSRF_TOKEN = '{{ csrf_token }}';

// ── Popup HTML ────────────────────────────────────────────────────────────
var estadoLabels = {
    'pendiente':  'Pendiente',
    'revisando':  'En revisión',
    'en_proceso': 'En proceso',
    'resuelto':   'Resuelto',
    'rechazado':  'Rechazado',
};
var estadoStyles = {
    'pendiente':  'background:#fef2f2;color:#dc2626',
    'revisando':  'background:#eff6ff;color:#2563eb',
    'en_proceso': 'background:#fffbeb;color:#d97706',
    'resuelto':   'background:#f0fdf4;color:#16a34a',
    'rechazado':  'background:#f3f4f6;color:#6b7280',
};

function makePopup(p) {
    var urg    = urgencyConfig[parseInt(p.urgencia, 10)] || urgencyConfig[2];
    var emoji  = getCatEmoji(p.categoria);
    var desc   = (p.descripcion || 'Sin descripción').substring(0, 120);
    if ((p.descripcion || '').length > 120) desc += '…';
    var estilo = estadoStyles[p.estado] || 'background:#f3f4f6;color:#374151';
    var label  = estadoLabels[p.estado] || p.estado;
    var barrio = p.barrio && p.barrio.trim() ? p.barrio : 'Barrio no especificado';
    var lat    = p.latitud, lng = p.longitud;

    var fotoHtml = '';
    if (p.foto_url) {
        fotoHtml =
            '<div style="width:100%;height:130px;overflow:hidden;">' +
                '<img src="' + p.foto_url + '" alt="Foto" ' +
                     'style="width:100%;height:100%;object-fit:cover;" ' +
                     'onerror="this.parentElement.style.display=\'none\'">' +
            '</div>';
    }

    // Botón resolver (solo si no está resuelto)
    var resolverHtml = '';
    if (p.estado !== 'resuelto' && p.estado !== 'rechazado') {
        resolverHtml =
            '<button onclick="resolverReporte(\'' + p.id + '\', this)" ' +
                'style="width:100%;margin-top:10px;padding:9px 0;' +
                'background:#10b981;color:white;border:none;border-radius:10px;' +
                'font-size:12px;font-weight:800;cursor:pointer;' +
                'display:flex;align-items:center;justify-content:center;gap:6px;">' +
                '<svg style="width:14px;height:14px;stroke:white;" fill="none" stroke-width="2.5" viewBox="0 0 24 24">' +
                    '<path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>' +
                '</svg>' +
                'Marcar como resuelto' +
            '</button>';
    }

    // Botones de navegación
    var gmapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lng;
    var wazeUrl  = 'https://waze.com/ul?ll=' + lat + ',' + lng + '&navigate=yes';

    var navHtml =
        '<div style="display:flex;gap:6px;margin-top:8px;">' +
            '<a href="' + gmapsUrl + '" target="_blank" ' +
               'style="flex:1;padding:7px 4px;background:#4285f4;color:white;border-radius:9px;' +
               'font-size:11px;font-weight:700;text-align:center;text-decoration:none;' +
               'display:flex;align-items:center;justify-content:center;gap:4px;">' +
                '<svg style="width:12px;height:12px;stroke:white;flex-shrink:0;" fill="none" stroke-width="2" viewBox="0 0 24 24">' +
                    '<path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>' +
                '</svg>' +
                'Google Maps' +
            '</a>' +
            '<a href="' + wazeUrl + '" target="_blank" ' +
               'style="flex:1;padding:7px 4px;background:#33ccff;color:white;border-radius:9px;' +
               'font-size:11px;font-weight:700;text-align:center;text-decoration:none;' +
               'display:flex;align-items:center;justify-content:center;gap:4px;">' +
                '<svg style="width:12px;height:12px;stroke:white;flex-shrink:0;" fill="none" stroke-width="2" viewBox="0 0 24 24">' +
                    '<path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>' +
                    '<path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>' +
                '</svg>' +
                'Waze' +
            '</a>' +
        '</div>';

    return (
        '<div style="font-family:\'Outfit\',sans-serif;padding:0;border-radius:16px;overflow:hidden;min-width:240px;max-width:290px;">' +
            fotoHtml +
            '<div style="background:' + (p.color || '#10b981') + ';padding:12px 16px;color:white;">' +
                '<div style="display:flex;align-items:center;gap:8px;margin-bottom:3px;">' +
                    '<span style="font-size:17px;">' + emoji + '</span>' +
                    '<span style="font-size:11px;font-weight:800;opacity:0.9;text-transform:uppercase;letter-spacing:0.05em;">' +
                        (p.categoria || 'General') +
                    '</span>' +
                '</div>' +
                '<div style="font-size:14px;font-weight:900;line-height:1.3;">' + barrio + '</div>' +
            '</div>' +
            '<div style="padding:12px 16px;">' +
                '<p style="font-size:12px;color:#6b7280;margin:0 0 10px;line-height:1.5;">' + desc + '</p>' +
                '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">' +
                    '<span style="font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;' + estilo + '">' + label + '</span>' +
                    '<span style="font-size:11px;font-weight:700;color:' + urg.color + ';">' + urg.emoji + ' ' + urg.label + '</span>' +
                '</div>' +
                navHtml +
                resolverHtml +
            '</div>' +
        '</div>'
    );
}

// ── Resolver reporte desde el mapa ───────────────────────────────────────
function resolverReporte(reporteId, btn) {
    btn.disabled = true;
    btn.textContent = 'Procesando...';
    fetch('/panel/reportes/' + reporteId + '/estado/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRFToken': CSRF_TOKEN,
        },
        body: 'estado=resuelto',
    }).then(function(res) {
        if (res.ok || res.redirected) {
            // Quitar el marcador del mapa
            var idx = allMarkers.findIndex(function(m) { return m._reporteId === reporteId; });
            if (idx !== -1) {
                layerGroup.removeLayer(allMarkers[idx]);
                allMarkers.splice(idx, 1);
                map.closePopup();
                updateVisibleCount();
            }
            // Actualizar contador header
            var totalEl = document.querySelector('.font-bold.text-primary-600');
            if (totalEl) totalEl.textContent = allMarkers.length;
        } else {
            btn.disabled = false;
            btn.textContent = 'Error — reintentar';
        }
    }).catch(function() {
        btn.disabled = false;
        btn.textContent = 'Error — reintentar';
    });
}

// ── Filtros por urgencia ─────────────────────────────────────────────────
var activeFilters = new Set([1, 2, 3, 4]);   // definido ANTES de usarlo

// ── Marcadores ───────────────────────────────────────────────────────────
var layerGroup = L.layerGroup().addTo(map);
var allMarkers = [];

puntosData.forEach(function(p) {
    if (!p.latitud || !p.longitud) return;
    var marker = L.marker([p.latitud, p.longitud], {
        icon: createIcon(p),
    }).bindPopup(makePopup(p), { maxWidth: 290, closeButton: false });
    marker._urgencia  = parseInt(p.urgencia, 10);
    marker._reporteId = p.id;
    allMarkers.push(marker);
    layerGroup.addLayer(marker);
});

updateVisibleCount();

function filterByUrgencia(urg, btn) {
    urg = parseInt(urg, 10);                 // ← asegurar número
    if (activeFilters.has(urg)) {
        activeFilters.delete(urg);
        btn.classList.remove('active');
        btn.style.background   = 'white';
        btn.style.color        = '#64748b';
        btn.style.borderColor  = '#e2e8f0';
    } else {
        activeFilters.add(urg);
        btn.classList.add('active');
        btn.style.background   = urgencyConfig[urg].color;
        btn.style.color        = 'white';
        btn.style.borderColor  = 'transparent';
    }
    refreshMarkers();
}

function refreshMarkers() {
    layerGroup.clearLayers();
    allMarkers.forEach(function(m) {
        if (activeFilters.has(m._urgencia)) layerGroup.addLayer(m);
    });
    updateVisibleCount();
}

function updateVisibleCount() {
    var visible = allMarkers.filter(function(m) { return activeFilters.has(m._urgencia); }).length;
    document.getElementById('visible-count').textContent =
        'Mostrando ' + visible + ' de ' + allMarkers.length + ' reportes';
}

function resetView() {
    if (allMarkers.length > 0) {
        map.fitBounds(new L.featureGroup(allMarkers).getBounds().pad(0.15));
    } else {
        map.setView([18.4861, -69.9312], 13);
    }
}

if (allMarkers.length > 0) setTimeout(resetView, 300);

// ── Auto-actualización cada 30 segundos ──────────────────────────────────
var knownIds = new Set(puntosData.map(function(p) { return p.id; }));
var pulseEl  = document.getElementById('live-pulse');

function syncMapa() {
    fetch('/panel/api/puntos/', { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        var serverIds = new Set(data.puntos.map(function(p) { return p.id; }));

        // Eliminar marcadores que ya no están en el servidor (resueltos)
        allMarkers = allMarkers.filter(function(m) {
            if (!serverIds.has(m._reporteId)) {
                layerGroup.removeLayer(m);
                knownIds.delete(m._reporteId);
                return false;
            }
            return true;
        });

        // Agregar marcadores nuevos
        data.puntos.forEach(function(p) {
            if (!knownIds.has(p.id) && p.latitud && p.longitud) {
                var marker = L.marker([p.latitud, p.longitud], { icon: createIcon(p) })
                    .bindPopup(makePopup(p), { maxWidth: 290, closeButton: false });
                marker._urgencia  = parseInt(p.urgencia, 10);
                marker._reporteId = p.id;
                allMarkers.push(marker);
                knownIds.add(p.id);
                if (activeFilters.has(marker._urgencia)) layerGroup.addLayer(marker);
            }
        });

        updateVisibleCount();
        // Parpadeo indicador live
        if (pulseEl) {
            pulseEl.style.opacity = '1';
            setTimeout(function() { pulseEl.style.opacity = '0.4'; }, 600);
        }
    })
    .catch(function() {});   // silencia errores de red
}

setInterval(syncMapa, 30000);   // cada 30 s
</script>
{% endblock %}
